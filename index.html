<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<link rel="stylesheet" href="css/styles.css" />

<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="wordmark" href="#top">Shaamray</a>
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="primaryNav">
      <span></span><span></span><span></span>
      <span class="sr-only">Menu</span>
    </button>
    <nav class="primary-nav" id="primaryNav">
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#projects">Projects</a>
      <a href="#publications">Publications</a>
      <a href="#certifications">Certifications</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main id="main">

  <section class="hero" id="top">
    <div class="wrap hero-grid">
      <div class="hero-text">
        <p class="eyebrow" id="heroLocation"></p>
        <h1 id="heroName"></h1>
        <p class="hero-tagline" id="heroTagline"></p>
        <div class="hero-links" id="heroLinks"></div>
      </div>
      <div class="hero-photo">
        <div class="photo-frame">
          <img id="heroPhoto" src="" alt="" />
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="about">
    <div class="wrap wrap-narrow">
      <h2>About</h2>
      <div id="bioText"></div>
    </div>
  </section>

  <section class="section" id="experience">
    <div class="wrap wrap-narrow">
      <h2>Experience</h2>
      <ol class="timeline" id="experienceList"></ol>
    </div>
  </section>

  <section class="section" id="education">
    <div class="wrap wrap-narrow">
      <h2>Education</h2>
      <ul class="plain-list" id="educationList"></ul>
    </div>
  </section>

  <section class="section" id="projects">
    <div class="wrap">
      <h2>Featured projects</h2>
      <div class="project-grid" id="featuredProjects"></div>

      <h3 class="subhead">More on GitHub</h3>
      <ul class="project-list" id="moreProjects"></ul>
    </div>
  </section>

  <section class="section" id="publications">
    <div class="wrap wrap-narrow">
      <h2>Publications</h2>
      <ul class="pub-list" id="publicationsList"></ul>

      <div class="research-note" id="researchNote"></div>
    </div>
  </section>

  <section class="section" id="certifications">
    <div class="wrap wrap-narrow">
      <h2>Certifications</h2>
      <ul class="cert-list" id="certificationsList"></ul>
    </div>
  </section>

  <section class="section section-contact" id="contact">
    <div class="wrap wrap-narrow">
      <h2>Get in touch</h2>
      <p id="contactText"></p>
      <div class="hero-links" id="contactLinks"></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <p id="footerText"></p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
